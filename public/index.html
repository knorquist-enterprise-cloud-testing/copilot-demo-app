<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>copilot-demo-app</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>copilot-demo-app</h1>
      <!--
        TODO (IDE Agent Mode demo, Issue #3):
        Replace this placeholder with a live status badge that polls /api/healthz.
      -->
      <span id="status-badge" class="badge badge-unknown">status: unknown</span>
    </header>

    <main>
      <section>
        <h2>Register a user</h2>
        <form id="register-form">
          <label>
            Username
            <input name="username" required />
          </label>
          <label>
            Email
            <input name="email" type="email" required />
          </label>
          <button type="submit">Register</button>
        </form>
        <pre id="result"></pre>
      </section>

      <section>
        <h2>Users</h2>
        <ul id="user-list"></ul>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
